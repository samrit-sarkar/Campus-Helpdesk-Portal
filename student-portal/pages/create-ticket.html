<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>New Ticket – UniAssist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>

<body data-page="create-ticket">
    <div class="layout">
        <aside id="sidebar" class="sidebar"></aside>
        <div class="main">
            <header id="topbar" class="topbar"></header>
            <main class="content">
                <h1 class="page-title">Create Maintenance Ticket</h1>
                <p class="page-sub">Tell us what needs fixing.</p>
                <div class="card form-card">
                    <form id="ticketForm" novalidate>
                        <div class="field">
                            <label>Ticket Title</label>
                            <input type="text" name="title" placeholder="e.g. WiFi Not Working" required>
                            <div class="err-msg"></div>
                        </div>
                        <div class="field"><label>Category</label><select name="category"></select>
                            <div class="err-msg"></div>
                        </div>
                        <div class="field"><label>Room number</label><input type="text" name="roomNumber"
                                placeholder="e.g. B-204">
                            <div class="err-msg"></div>
                        </div>
                        <div class="field"><label>Description</label><textarea name="description"
                                placeholder="Describe the issue"></textarea>
                            <div class="err-msg"></div>
                        </div>
                        <div class="field"><label>Priority</label><input type="text" value="MEDIUM" disabled>
                            <div class="hint">Priority defaults to MEDIUM.</div>
                        </div>
                        <button class="btn" type="submit"><i class="fa-solid fa-paper-plane"></i> Submit ticket</button>
                    </form>
                </div>
            </main>
        </div>
    </div>
    <div id="toasts"></div>
    <script src="../js/config.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/tickets.js"></script>
</body>

</html>
