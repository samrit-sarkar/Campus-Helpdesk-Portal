<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login – UniAssist Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css"></head>
<body><div class="auth-wrap"><div class="auth-card">
<div class="brand"><i class="fa-solid fa-graduation-cap"></i> UniAssist</div>
<h1>Staff / Admin Login</h1><p class="sub">Sign in to manage tickets and reports.</p><div id="formError" class="form-error"></div>
<form id="loginForm" novalidate>
<div class="field"><label>Email</label><input type="email" name="email" placeholder="staff@university.edu"><div class="err-msg"></div></div>
<div class="field"><label>Password</label><input type="password" name="password"><div class="err-msg"></div></div>
<button class="btn" type="submit">Login</button></form>
<div class="auth-foot"><a href="http://localhost:5173/">UniAssist student portal</a></div>
</div></div><div id="toasts"></div>
<script src="js/api.js"></script><script src="js/auth.js"></script></body></html>
